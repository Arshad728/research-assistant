[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-assistant"
version = "0.1.0"
description = "Multi-agent research assistant: search, verify, and write cited reports."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "claude-agent-sdk==0.2.152",
    "python-dotenv==1.2.3",
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "pymupdf==1.28.2",
    "trafilatura==2.2.0",
    "reportlab==5.0.1",
]

[project.scripts]
research-assistant = "research_assistant.cli:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
]
ui = [
    "streamlit==1.63.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Integration tests hit the real internet, so they are opt-in: a plain
# `pytest` run stays offline and fast. Run them with `pytest -m integration`.
addopts = ["-m", "not integration"]
markers = [
    "integration: hits real external APIs; needs network access and API keys",
]

[tool.hatch.build.targets.wheel]
packages = ["src/research_assistant"]
